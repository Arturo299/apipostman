spring.application.name=pizzeria-api
server.port=8080

# --- Base de datos H2 en memoria (se recrea en cada arranque con data.sql) ---
spring.datasource.url=jdbc:h2:mem:pizzeria;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:pizzeria, usuario sa, sin password)
spring.h2.console.enabled=true

# --- Negocio ---
pizzeria.pricing.profit-margin=0.20

# --- Autenticación didáctica ---
pizzeria.auth.users.admin=admin123
pizzeria.auth.users.alumno=postman
pizzeria.auth.access-token-ttl=5m
pizzeria.auth.refresh-token-ttl=1h

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
